services:
  db:
    image: postgres:15-alpine
    container_name: election-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: eleicoes26
      POSTGRES_USER: eleicoes26
      POSTGRES_PASSWORD: dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eleicoes26 -d eleicoes26"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
