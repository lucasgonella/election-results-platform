name: FTP publication validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ftp-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Require PHP and validate syntax
        run: |
          php --version
          php -l deploy/locaweb/ftp-publication.php
          php -l deploy/locaweb/election-ftp-control.php
          php -l deploy/locaweb/prepare-ftp-baseline.php
          php -l deploy/locaweb/ftp-staging-probe.php
          bash -n deploy/scripts/run-ftp-live-publisher.sh
      - run: python -m pip install -r collector/requirements-dev.txt
      - run: python -m pytest -q
      - run: |
          node --check web/public/eleicoes/app.js
          node --check web/public/eleicoes/favorites.js
