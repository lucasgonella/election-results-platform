name: Deploy Raio-X Goiás via FTP port 21
on:
  push:
    branches: [main]
    paths:
      - 'web/public/eleicoes/goias/raio-x/**'
      - '!web/public/eleicoes/goias/raio-x/data/**'
      - '!web/public/eleicoes/goias/raio-x/**/*.md'
      - 'deploy/frontend.py'
      - 'deploy/frontend-*'
      - 'deploy/scripts/wait-frontend-ci.py'
      - 'deploy/scripts/recover-frontend-owned-actions.py'
      - '.github/workflows/deploy-goias-ftp.yml'
      - '.github/workflows/deploy-frontend-ftp.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  frontend:
    uses: ./.github/workflows/deploy-frontend-ftp.yml
    with:
      component: raio-x
    secrets: inherit
