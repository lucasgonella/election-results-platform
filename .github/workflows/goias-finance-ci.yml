name: Validate Goiás finance frontend
on:
  pull_request:
    paths:
      - 'web/public/eleicoes/goias/raio-x/**'
      - '.github/workflows/goias-finance-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/public/eleicoes/goias/raio-x/**'
      - '.github/workflows/goias-finance-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend contract and safe empty state
        run: |
          python3 -m unittest tests.test_premium_finance_graph -v
      - name: JavaScript syntax check (Node.js)
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from html.parser import HTMLParser
          import subprocess
          root = Path("web/public/eleicoes/goias/raio-x")
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      source = dict(attrs).get("src")
                      assert source, "Inline JavaScript must be explicitly validated"
                      self.sources.append(PurePosixPath(source.split("?", 1)[0]).as_posix())
          parser = Scripts()
          parser.feed((root / "index.html").read_text())
          assert sorted(parser.sources) == ["finance-app.js", "finance-core.js"]
          for name in parser.sources:
              subprocess.run(["node", "--check", str(root / name)], check=True)
          PY
