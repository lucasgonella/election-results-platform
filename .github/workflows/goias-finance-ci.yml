name: Validate Goiás finance frontend
on:
  pull_request:
    paths:
      - 'web/public/eleicoes/goias/raio-x/**'
      - '.github/workflows/goias-finance-ci.yml'
      - 'tests/test_raiox_navigation*.py'
      - 'tests/raiox_navigation_fixtures.py'
      - 'tests/raiox-browser-requirements.txt'
  push:
    branches: [main]
    paths:
      - 'web/public/eleicoes/goias/raio-x/**'
      - '.github/workflows/goias-finance-ci.yml'
      - 'tests/test_raiox_navigation*.py'
      - 'tests/raiox_navigation_fixtures.py'
      - 'tests/raiox-browser-requirements.txt'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frontend contract and safe empty state
        run: |
          python3 -m unittest tests.test_premium_finance_graph tests.test_raiox_navigation -v
      - name: Install real-browser test dependencies
        run: |
          python3 -m pip install -r tests/raiox-browser-requirements.txt
          python3 -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/raiox-qa" --no-package-lock --no-save axe-core@4.14.0
      - name: Required global-adjacency, interaction and accessibility acceptance
        env:
          RAIOX_BROWSER_REQUIRED: '1'
          RAIOX_AXE_PATH: ${{ runner.temp }}/raiox-qa/node_modules/axe-core/axe.min.js
        run: python3 -m unittest tests.test_raiox_navigation_browser -v
      - name: JavaScript syntax check (Node.js)
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from html.parser import HTMLParser
          import subprocess
          root = Path("web/public/eleicoes/goias/raio-x")
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      source = dict(attrs).get("src")
                      assert source, "Inline JavaScript must be explicitly validated"
                      self.sources.append(PurePosixPath(source.split("?", 1)[0]).as_posix())
          parser = Scripts()
          parser.feed((root / "index.html").read_text())
          assert sorted(parser.sources) == [
              "analytics.js", "finance-app.js", "finance-core.js",
              "https:/www.googletagmanager.com/gtag/js",
          ]
          for name in parser.sources:
              if name.startswith("https:/www.googletagmanager.com/gtag/js"):
                  continue  # Third-party loader is not a local JavaScript asset.
              subprocess.run(["node", "--check", str(root / name)], check=True)
          PY
