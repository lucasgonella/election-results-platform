name: Validate Goiás finance frontend
on:
  pull_request:
    paths:
      - 'web/public/eleicoes/goias/raio-x/**'
      - '.github/workflows/goias-finance-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/public/eleicoes/goias/raio-x/**'
      - '.github/workflows/goias-finance-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend contract and safe empty state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("web/public/eleicoes/goias/raio-x/index.html")
          html = p.read_text()
          assert '<!doctype html>' in html.lower()
          assert 'go-2026.json' in html
          assert 'data.scope!=="GO"' in html
          assert 'data.year!==2026' in html
          assert 'Não exibimos candidatos nem valores fictícios' in html
          assert 'source_url' in html
          assert 'deputado federal' in html and 'deputado estadual' in html
          print("GO FINANCE FRONTEND: VALIDATED")
          PY
      - name: JavaScript syntax check (Node.js)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("web/public/eleicoes/goias/raio-x/index.html").read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          assert len(scripts)==1
          Path("/tmp/go-finance.js").write_text(scripts[0])
          PY
          node --check /tmp/go-finance.js
