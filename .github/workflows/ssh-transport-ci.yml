name: Validate SSH rsync transport
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r collector/requirements-dev.txt
      - name: Transaction recovery and isolated filesystem protocol
        run: python -m pytest -q tests/test_ssh_transport.py tests/test_static_election_publish.py tests/test_second_round_transactions.py tests/test_cycle_retention.py tests/test_municipal_pipeline.py tests/test_frontend_deploy.py tests/test_goias_finance_publish.py
      - run: python -m compileall -q deploy collector
      - run: git diff --check
