name: CD — HTTPS staging on app01

on:
  push:
    branches: [main]
    paths:
      - 'deploy/locaweb/**'
      - 'deploy/scripts/publish-live-results-https.py'
      - 'deploy/scripts/release-https-staging.sh'
      - 'deploy/scripts/rollback-https-staging.sh'
      - '.github/workflows/https-staging-cd.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Isolated staging release operation'
        required: true
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read

concurrency:
  group: https-staging-app01
  cancel-in-progress: false

jobs:
  stage-on-app01:
    if: vars.ENABLE_HTTPS_STAGING_CD == 'true'
    runs-on: [self-hosted, linux, x64, election-app01]
    environment: https-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # PHP syntax and sandbox tests run in the GitHub-hosted CI workflow.
      # The app01 deployment runner needs Python only; it does not execute PHP.
      - name: Validate Python client on app01
        run: python3 -m py_compile deploy/scripts/publish-live-results-https.py
      - name: Deploy isolated release (no systemd changes)
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        env:
          REV: ${{ github.sha }}
        run: bash deploy/scripts/release-https-staging.sh "$REV"
      - name: Roll back isolated release pointer
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
        run: bash deploy/scripts/rollback-https-staging.sh
