name: Import TSE finance data for Goiás
on:
  push:
    branches: [main]
    paths:
      - 'tools/goias_finance_etl.py'
      - 'tools/goias_identity.py'
      - 'tools/goias_finance_publish.py'
      - '.github/workflows/goias-finance-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 9,15,21 * * *'
permissions:
  contents: write
concurrency:
  group: goias-finance-etl
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Exclude deploy, rollback and recovery until financial verification ends.
    # Do not wait for a visual deploy while holding this group: fail closed.
    concurrency:
      group: locaweb-frontend-production
      queue: max
      cancel-in-progress: false
    env:
      PUBLICATION_TRANSPORT: ${{ vars.LOCAWEB_FINANCE_TRANSPORT || 'ftp' }}
      # Literal protocol marker: legacy queued definitions cannot publish schema 1.
      FINANCE_PREFLIGHT_PROTOCOL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Require already published compatible Raio-X before collection
        env:
          LOCAWEB_FTP_PORT: '21'
          LOCAWEB_FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          LOCAWEB_FTP_USER: ${{ secrets.LOCAWEB_FTP_USER }}
          LOCAWEB_FTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_PASSWORD }}
          LOCAWEB_FTP_GOIAS_DIR: ${{ vars.LOCAWEB_FTP_GOIAS_DIR }}
        run: python3 -m deploy.finance_preflight
      - name: Unit test financial importer
        run: |
          python3 -m pip install -r collector/requirements-dev.txt
          python3 -m unittest discover -s tests -p 'test_goias*py' -v
          python3 -m pytest -q tests/test_goias_finance_publish.py
      - name: Download official TSE datasets
        run: |
          set -euo pipefail
          mkdir -p /tmp/tse-go
          curl -fL --retry 3 --connect-timeout 30 --max-time 1500 \
            'https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_2026.zip' \
            -o /tmp/tse-go/candidates.zip
          curl -fL --retry 3 --connect-timeout 30 --max-time 1500 \
            'https://cdn.tse.jus.br/estatistica/sead/odsele/prestacao_contas/prestacao_de_contas_eleitorais_candidatos_2026.zip' \
            -o /tmp/tse-go/finance.zip
          unzip -tqq /tmp/tse-go/candidates.zip
          unzip -tqq /tmp/tse-go/finance.zip
      - name: Generate GO-only data from TSE
        run: |
          python3 tools/goias_finance_etl.py \
            --candidates /tmp/tse-go/candidates.zip \
            --finance /tmp/tse-go/finance.zip \
            --output web/public/eleicoes/goias/raio-x/data/go-2026.json
      - name: Recheck compatible Raio-X before committing financial data
        env:
          LOCAWEB_FTP_PORT: '21'
          LOCAWEB_FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          LOCAWEB_FTP_USER: ${{ secrets.LOCAWEB_FTP_USER }}
          LOCAWEB_FTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_PASSWORD }}
          LOCAWEB_FTP_GOIAS_DIR: ${{ vars.LOCAWEB_FTP_GOIAS_DIR }}
        run: python3 -m deploy.finance_preflight
      - name: Validate and publish only complete dataset
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('web/public/eleicoes/goias/raio-x/data/go-2026.json').read_text())
          assert d['scope']=='GO' and d['year']==2026
          assert len(d['candidates'])>100
          assert d['transfers']
          assert all(c['office'] in ('deputado estadual','deputado federal') for c in d['candidates'])
          print('Validated candidate count:',len(d['candidates']))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/eleicoes/goias/raio-x/data/go-2026.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(go): update official candidate finance export'
          git push origin HEAD:main
      - name: Prepare dedicated SSH identity only when selected
        env:
          LOCAWEB_SSH_PRIVATE_KEY: ${{ secrets.LOCAWEB_SSH_PRIVATE_KEY }}
          LOCAWEB_SSH_KNOWN_HOSTS: ${{ secrets.LOCAWEB_SSH_KNOWN_HOSTS }}
        run: python deploy/scripts/prepare-ssh.py
      - name: Upload validated GO dataset through selected transport
        env:
          LOCAWEB_FTP_PORT: '21'
          LOCAWEB_FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          LOCAWEB_FTP_USER: ${{ secrets.LOCAWEB_FTP_USER }}
          LOCAWEB_FTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_PASSWORD }}
          LOCAWEB_FTP_GOIAS_DIR: ${{ vars.LOCAWEB_FTP_GOIAS_DIR }}
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.LOCAWEB_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_PASSWORD }}
          FTP_DIR: ${{ vars.LOCAWEB_FTP_GOIAS_DIR }}
        run: |
          python3 -m tools.goias_finance_publish \
            --file web/public/eleicoes/goias/raio-x/data/go-2026.json
